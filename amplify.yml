version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - npm ci
    build:
      commands:
        # Amplify SSR only exposes env vars to the build; write the server ones to .env.production
        # so the Next.js compute runtime can read them. Never commit these values.
        - env | grep -E '^(APP_ORIGIN|APP_ORIGINS|DATA_BACKEND|SUPABASE_URL|SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|AI_MODE|ENABLE_SUBDOMAIN_ROUTING)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
