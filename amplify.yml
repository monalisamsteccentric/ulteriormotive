version: 1
frontend:
  phases:
    build:
      commands:
        - mkdir -p dist
        - cp index.html styles.css app.js blog-background.png infrastructure.yml favicon.ico favicon.png apple-touch-icon.png dist/
        - printf '{"lookupUrl":"%s"}' "$LOOKUP_URL" > dist/config.json
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
