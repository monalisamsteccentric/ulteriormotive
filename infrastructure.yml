AWSTemplateFormatVersion: '2010-09-09'
Description: Public code lookup with password-protected admin publishing
Parameters:
  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 10
    Description: Password for the admin account. Enter it when creating or updating the stack.
Resources:
  CodesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
  LookupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadCodes
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt CodesTable.Arn
  LookupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt LookupRole.Arn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref CodesTable
          ADMIN_PASSWORD: !Ref AdminPassword
      Code:
        ZipFile: |
          import hashlib
          import hmac
          import json
          import os
          import re
          import time
          import boto3
          
          dynamodb = boto3.client('dynamodb')
          table_name = os.environ['TABLE_NAME']
          admin_password = os.environ['ADMIN_PASSWORD']
          
          def reply(status, body):
              return {
                  'statusCode': status,
                  'headers': {'content-type': 'application/json; charset=utf-8',
                              'cache-control': 'no-store'},
                  'body': json.dumps(body)
              }
          
          def request_json(event):
              body = event.get('body') or ''
              if len(body) > 25000:
                  return None
              try:
                  value = json.loads(body)
                  return value if isinstance(value, dict) else None
              except (TypeError, ValueError):
                  return None
          
          def token_is_valid(event):
              headers = {key.lower(): value for key, value in
                         (event.get('headers') or {}).items()}
              authorization = headers.get('authorization', '')
              if not authorization.startswith('Bearer '):
                  return False
              token = authorization[7:]
              try:
                  expiry, signature = token.split('.', 1)
                  expires_at = int(expiry)
              except (TypeError, ValueError):
                  return False
              if expires_at <= time.time() or expires_at > time.time() + 3600:
                  return False
              expected = hmac.new(admin_password.encode(), expiry.encode(),
                                  hashlib.sha256).hexdigest()
              return hmac.compare_digest(signature, expected)
          
          def handler(event, context):
              method = (event.get('requestContext') or {}).get('http', {}).get('method')
              path = event.get('rawPath', '/')
          
              if method == 'POST' and path == '/admin/login':
                  data = request_json(event)
                  if data is None:
                      return reply(400, {'error': 'Invalid request'})
                  username = data.get('username')
                  password = data.get('password')
                  if not isinstance(username, str) or not isinstance(password, str):
                      return reply(401, {'error': 'Invalid credentials'})
                  valid_user = hmac.compare_digest(username, 'admin')
                  valid_password = hmac.compare_digest(password, admin_password)
                  if not (valid_user and valid_password):
                      return reply(401, {'error': 'Invalid credentials'})
                  expiry = str(int(time.time()) + 3600)
                  signature = hmac.new(admin_password.encode(), expiry.encode(),
                                       hashlib.sha256).hexdigest()
                  return reply(200, {'token': expiry + '.' + signature})
          
              if method == 'POST' and path == '/admin/codes':
                  if not token_is_valid(event):
                      return reply(401, {'error': 'Sign in required'})
                  data = request_json(event)
                  if data is None:
                      return reply(400, {'error': 'Invalid request'})
                  code = data.get('code')
                  value = data.get('text')
                  if not isinstance(code, str) or not re.fullmatch(r'[A-Z0-9_-]{1,64}', code):
                      return reply(400, {'error': 'Invalid code'})
                  if not isinstance(value, str) or not 1 <= len(value.strip()) <= 10000:
                      return reply(400, {'error': 'Invalid text'})
                  try:
                      dynamodb.put_item(
                          TableName=table_name,
                          Item={'code': {'S': code}, 'text': {'S': value.strip()}},
                          ConditionExpression='attribute_not_exists(#c)',
                          ExpressionAttributeNames={'#c': 'code'})
                  except dynamodb.exceptions.ConditionalCheckFailedException:
                      return reply(409, {'error': 'Code already exists'})
                  except Exception:
                      print('DynamoDB write failed', flush=True)
                      return reply(503, {'error': 'Save unavailable'})
                  return reply(201, {'code': code})
          
              if method == 'GET' and path == '/':
                  code = (event.get('queryStringParameters') or {}).get('code', '')
                  if not isinstance(code, str) or not re.fullmatch(r'[A-Z0-9_-]{1,64}', code):
                      return reply(400, {'error': 'Invalid code'})
                  try:
                      response = dynamodb.get_item(
                          TableName=table_name,
                          Key={'code': {'S': code}},
                          ProjectionExpression='#t',
                          ExpressionAttributeNames={'#t': 'text'})
                  except Exception:
                      print('DynamoDB lookup failed', flush=True)
                      return reply(503, {'error': 'Lookup unavailable'})
                  value = response.get('Item', {}).get('text', {}).get('S')
                  if value is None:
                      return reply(404, {'error': 'Code not found'})
                  return reply(200, {'text': value})
          
              return reply(404, {'error': 'Not found'})
  LookupUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt LookupFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - Content-Type
          - Authorization
  PublicInvokeUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LookupFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE
  PublicInvokeFunction:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LookupFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
Outputs:
  LookupUrl:
    Value: !GetAtt LookupUrl.FunctionUrl
    Description: Set this value as LOOKUP_URL in Amplify environment variables.
  TableName:
    Value: !Ref CodesTable
    Description: Add items with code (String) and text (String) in DynamoDB.
